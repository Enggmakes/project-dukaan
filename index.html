    <script>
      (function() {
        function updateFavicon() {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var link = document.getElementById('app-favicon');
          if (link) {
            link.href = isDark ? '/logo-white.png?v=dukaan4' : '/logo.png?v=dukaan4';
          }
        }
        updateFavicon();
        try {
          var matcher = window.matchMedia('(prefers-color-scheme: dark)');
          if (matcher.addEventListener) {
            matcher.addEventListener('change', updateFavicon);
          } else if (matcher.addListener) {
            matcher.addListener(updateFavicon);
          }
        } catch (e) {}
      })();
    </script>
